[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# Fixed-address, non-PIE images. code-model=kernel lets the kernel live in the
# top 2 GiB; it also fits the user program at 0x400000 (sign-extended 32-bit).
rustflags = ["-C", "relocation-model=static", "-C", "code-model=kernel"]
