[package]
name = "vanir-kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vanir-kernel"
test = false
bench = false

[dependencies]
vanir-abi = { path = "../abi" }
ed25519-compact = { version = "2.6.0", default-features = false }
limine = "0.5"
sha2 = { version = "0.11.0", default-features = false }
spin = "0.10"
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }

[features]
# Test only: sys_write skips stac, so SMAP must fault the kernel on the user buffer.
smap-selftest = []

[build-dependencies]
# Pinned: toml 1.1.8 depends on a toml_writer release the crates.io index does not offer.
toml = { version = "=1.1.7", default-features = false, features = ["std", "parse", "serde"] }
