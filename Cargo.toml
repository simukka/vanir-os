[workspace]
resolver = "2"
members = ["kernel", "user/lib", "user/hello", "user/spinner", "user/isolation", "user/runaway", "user/echo", "user/client", "user/deadlock", "user/supervisor", "user/crasher", "user/sleeper", "user/devprobe", "user/dmatest", "user/virtio", "user/virtio-console"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
debug = true
