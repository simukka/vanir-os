# A task without routes = true may not route.
[[task]]
name = "supervisor"
supervisor = true

[[task]]
name = "nic"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["net"]

[[task]]
name = "net"
sends = ["nic"]

[[task]]
name = "web-1"
program = "http"
service = "web"
sends = ["net"]
listen = [{ port = 80, max_connections = 64 }]

[[task]]
name = "web-2"
program = "http"
service = "web"
sends = ["net"]
listen = [{ port = 80, max_connections = 64 }]


[[task]]
name = "switcher"
sends = ["net"]
