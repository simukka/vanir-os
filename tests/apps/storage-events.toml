# Storage reporting its events (volume created, locked, unlocked, integrity errors) to telemetry.
[[task]]
name = "blockdev"
program = "virtio-blk"
devices = ["virtio-blk"]
dma_pages = 16

[[task]]
name = "disk"
program = "storage"
sends = ["blockdev", "keys", "telemetry"]

[[task]]
name = "client-a"
program = "blktest"
sends = ["disk"]

[[task]]
name = "keys"
program = "unlocker"

[[task]]
name = "virtio-console"
devices = ["virtio-console"]
dma_pages = 16

[[task]]
name = "telemetry"
events = true
sends = ["virtio-console"]
