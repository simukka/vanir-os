# agent.toml with a disk (RFD 3, V1): the control plane assigns writer epochs in desired state,
# and the agent hands them to the storage task ("disk") for the services it deploys.
[[task]]
name = "supervisor"
supervisor = true
sends = ["telemetry"]

[[task]]
name = "telemetry"
events = true

[[task]]
name = "nic"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["net"]

[[task]]
name = "net"
sends = ["nic", "telemetry"]

[[task]]
name = "nic-mgmt"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["mgmt-net"]

[[task]]
name = "mgmt-net"
program = "net"
sends = ["nic-mgmt"]

[[task]]
name = "blockdev"
program = "virtio-blk"
devices = ["virtio-blk"]
dma_pages = 16

[[task]]
name = "disk"
program = "storage"
sends = ["blockdev", "keys", "telemetry"]

[[task]]
name = "keys"
program = "unlocker"

[[task]]
name = "agent"
loads = true
routes = true
connects = true
sends = ["net", "mgmt-net", "supervisor", "telemetry", "disk"]

[[slot_class]]
name = "small"
count = 2
memory_pages = 256
image_pages = 128
sends = ["net", "disk"]
