# Two instances of one service; the switcher moves traffic between them (RFD 1, P3 and P4).
[[task]]
name = "supervisor"
supervisor = true

[[task]]
name = "nic"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["net"]

[[task]]
name = "net"
sends = ["nic"]

[[task]]
name = "web-1"
program = "http"
service = "web"
sends = ["net"]
listen = [{ port = 80, max_connections = 64 }]

[[task]]
name = "web-2"
program = "http"
service = "web"
sends = ["net"]
listen = [{ port = 80, max_connections = 64 }]


# Stands in for the node agent (RFD 2).
[[task]]
name = "switcher"
routes = true
sends = ["net"]
