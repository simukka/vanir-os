# Two clients, each with its own volume, behind the storage task ("disk"), unlocked with the key from "keys".
[[task]]
name = "blockdev"
program = "virtio-blk"
devices = ["virtio-blk"]
dma_pages = 16

[[task]]
name = "disk"
program = "storage"
sends = ["blockdev", "keys"]

[[task]]
name = "client-a"
program = "blktest"
sends = ["disk"]

[[task]]
name = "client-b"
program = "blktest"
sends = ["disk"]

[[task]]
name = "keys"
program = "unlocker"
