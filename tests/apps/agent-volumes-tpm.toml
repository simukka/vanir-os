# agent-volumes.toml with a TPM and without the "keys" stand-in (RFD 3, V2): the control plane
# seals each service's volume key to attest's per-boot key, the agent forwards the sealed blob,
# and attest opens it and hands the key to the storage task. No one releases the master key, so
# only service volumes open.
[[task]]
name = "supervisor"
supervisor = true
sends = ["telemetry"]

[[task]]
name = "telemetry"
events = true

[[task]]
name = "nic"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["net"]

[[task]]
name = "net"
sends = ["nic", "telemetry"]

[[task]]
name = "nic-mgmt"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["mgmt-net"]

[[task]]
name = "mgmt-net"
program = "net"
sends = ["nic-mgmt"]

[[task]]
name = "blockdev"
program = "virtio-blk"
devices = ["virtio-blk"]
dma_pages = 16

[[task]]
name = "disk"
program = "storage"
sends = ["blockdev", "telemetry"]

[[task]]
name = "attest"
tpm = true
sends = ["disk"]

[[task]]
name = "agent"
loads = true
routes = true
connects = true
sends = ["net", "mgmt-net", "supervisor", "telemetry", "disk", "attest"]

[[slot_class]]
name = "small"
count = 2
memory_pages = 256
image_pages = 128
sends = ["net", "disk"]
