# Attestation of what runs now (RFD 2, P6): the agent loads an image into a slot, and the quote
# covers PCR 13 and the run-time log.
[[task]]
name = "uplink"
program = "virtio-vsock"
devices = ["virtio-vsock"]
dma_pages = 32

[[task]]
name = "attest"
tpm = true

[[task]]
name = "control"
sends = ["uplink", "attest"]

[[task]]
name = "agent"
loads = true

[[slot_class]]
name = "small"
count = 1
memory_pages = 256
image_pages = 128
