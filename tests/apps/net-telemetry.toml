# The HTTP service with counters and events going to telemetry (over the virtio console).
[[task]]
name = "supervisor"
supervisor = true
sends = ["telemetry"]

[[task]]
name = "nic"
program = "virtio-net"
devices = ["virtio-net"]
dma_pages = 20
sends = ["net"]

[[task]]
name = "net"
sends = ["nic", "telemetry"]

[[task]]
name = "web"
program = "http"
sends = ["net", "telemetry"]
listen = [{ port = 80, max_connections = 64 }]

[[task]]
name = "virtio-console"
devices = ["virtio-console"]
dma_pages = 16

[[task]]
name = "telemetry"
events = true
sends = ["virtio-console"]
