# storage-events under a supervisor: the storage task or the block driver can crash and be
# restarted. A restarted storage task starts locked and asks "keys" for the key again.
[[task]]
name = "supervisor"
supervisor = true
sends = ["telemetry"]

[[task]]
name = "blockdev"
program = "virtio-blk"
devices = ["virtio-blk"]
dma_pages = 16

[[task]]
name = "disk"
program = "storage"
sends = ["blockdev", "keys", "telemetry"]

[[task]]
name = "client-a"
program = "blktest"
sends = ["disk"]

[[task]]
name = "keys"
program = "unlocker"

[[task]]
name = "virtio-console"
devices = ["virtio-console"]
dma_pages = 16

[[task]]
name = "telemetry"
events = true
sends = ["virtio-console"]
