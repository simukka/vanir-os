[package]
name = "vanir-rt"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
vanir-abi = { path = "../../abi" }

# The syscalls, in a slot only: on the host this crate is a test backend (src/host.rs).
[target.'cfg(target_os = "none")'.dependencies]
vanir-user = { path = "../lib" }

[features]
# `vanir_rt::raw`: the task's raw syscalls and IPC (vanir_user), for what the runtime doesn't
# wrap yet (RFD 9, P3). Not part of what the runtime promises.
unstable = []
