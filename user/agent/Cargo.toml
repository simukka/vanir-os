[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agent"
test = false
bench = false

[dependencies]
vanir-user = { path = "../lib" }
noise = { path = "../noise" }
ed25519-compact = { version = "2.6.0", default-features = false, features = ["x25519"] }
sha2 = { version = "0.11.0", default-features = false }

[features]
# tests only: exit once the desired state says `end` and nothing is under way
exit-on-end = []
# tests only: exit after three failed attempts to reach the control plane
exit-after-failures = []
# tests only: get a quote over some other key than the handshake's (the control plane refuses)
quote-wrong-key = []
# Test scripts, standing in for the control plane until there is one. Each carries the slot
# images it needs (built into build/slots by the Makefile).
test-images = []
# load web v1 into small-0, then wait
script-load = ["test-images"]
# load hello into small-0 and unload it again after it exits, 200 times, then exit
script-hello-loop = ["test-images"]
# load hello into small-0 (it exits 0, and stays down), then wait
script-hello = ["test-images"]
# load crasher into small-0 (the supervisor restarts it), then wait
script-crasher = ["test-images"]
# load hello, unload, load, unload, ... until the run-time log is full, then exit
script-fill-log = ["test-images"]
# load hello into small-0, retrying while the TPM is busy, then exit
script-load-retry = ["test-images"]
# try to load something the kernel must refuse into small-0, then exit:
try-unsigned = ["test-images"]        # no signature
try-tampered-image = ["test-images"]  # a byte of the image changed after signing
try-tampered-desc = ["test-images"]   # a byte of the descriptor changed after signing
try-boot-sig = ["test-images"]        # a boot image's signature file (VNRSIG01)
try-floor = ["test-images"]           # version below the descriptor's min_version
try-large = ["test-images"]           # descriptor asks for another slot class
try-occupied = ["test-images"]        # load web v1, then stage over it while it runs
try-web-v1 = ["test-images"]
# deployments with the lifecycle (RFD 2, P3/P4), web v1 live in small-0 first:
script-deploy = ["test-images"]      # deploy web v2 into small-1, then wait
script-rollback = ["test-images"]    # deploy web v2, then roll back to v1, then wait
script-not-ready = ["test-images"]   # deploy a web v2 that never says it is ready, then exit
script-drain-cap = ["test-images"]   # deploy web v2 asking for a drain longer than allowed, then exit
script-commit = ["test-images"]      # deploy web v2, commit, deploy web v1 into small-0 again, then exit          # web v1 (with a manifest or key that must refuse it)
# Volumes (RFD 3), with counter (http and a volume) and http/volume-probe:
script-volume-one = ["test-images"]      # counter v1 in small-0 with epoch 1, for 4 s, then exit
script-volume-fence = ["test-images"]    # v1 with epoch 1, v2 with epoch 2, v1 started again, epoch 1 again; exit
script-volume-persist = ["test-images"]  # (a second boot) v2 with epoch 2 again, then epoch 1; exit
script-volume-resize = ["test-images"]   # v1 with epoch 1, then v3 (another volume size); exit
script-volume-none = ["test-images"]     # web v1 (no volume) in small-0; exit
script-volume-forget = ["test-images"]   # v1 with epoch 1, drained and committed (key forgotten), then v1 again; exit
