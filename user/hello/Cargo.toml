[package]
name = "hello"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hello"
test = false
bench = false

[dependencies]
vanir-user = { path = "../lib" }

[features]
# Isolation test: read a kernel address from ring 3; must #PF.
poke-kernel = []
# write() from unmapped and partly-mapped buffers; the kernel must return an error.
bad-pointer = []
# NX test: jump to code written on the stack; must #PF on instruction fetch.
exec-stack = []
# W^X test: write to our own code; must #PF.
write-code = []
# Records read by size (RFD 9, P2): task_listen into buffers shorter and longer than the record.
abi-sizes = []
