[package]
name = "virtio-console"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "virtio-console"
test = false
bench = false

[dependencies]
vanir-user = { path = "../lib" }
virtio = { path = "../virtio" }

[features]
# First start only: fault right after submitting the 50th write (a write is in flight).
crash-after-50 = []
