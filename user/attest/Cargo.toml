[package]
name = "attest"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "attest"
test = false
bench = false

[dependencies]
vanir-user = { path = "../lib" }
tpm2 = { path = "../tpm2" }
ed25519-compact = { version = "2.6.0", default-features = false, features = ["x25519"] }
sha2 = { version = "0.11.0", default-features = false }
hkdf = "0.13.0"
chacha20poly1305 = { version = "0.11.0", default-features = false }
