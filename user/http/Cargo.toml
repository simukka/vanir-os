[package]
name = "http"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "http"
test = false
bench = false

[dependencies]
vanir-user = { path = "../lib" }

[features]
# For tests: GET /exit answers, then the task exits (with the supervisor's halt-on-exit, the run ends).
exit-on-request = []
# First start only: fault after serving 50 requests.
crash-after-50-requests = []
# Try to listen on port 81 first (which no manifest declares), then on 80.
listen-81 = []
# At start, try to talk to the management stack (`mgmt-net`), which the manifest doesn't allow.
try-mgmt-net = []
# Version 2 and later (signed as a slot image) never say they are ready (deploy-not-ready).
never-ready-v2 = []
# With a volume (RFD 3): write scratch block 1 every 100 ms and print each change in the result.
volume-probe = []
# With a volume: keep /count's count in memory, writing it to the volume every 10 s and before
# draining or exiting (load tests: memory against a disk write per request).
count-cached = []
# With volume-probe, first start only: fault after 20 probes (the writer is restarted in its slot).
crash-after-probes = ["volume-probe"]
